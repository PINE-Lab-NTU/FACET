[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "facet0-post-training"
version = "0.2.0"
description = "Facet-0 joint pretraining and value-guided refinement"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow"]

[project.optional-dependencies]
# Policy refinement and serving run on openpi (JAX); install openpi from its repository.
policy = [
  "jax==0.7.2", "flax==0.10.2", "optax==0.2.4", "orbax-checkpoint==0.11.40",
  "torch==2.7.1", "transformers==4.53.2", "safetensors", "tyro", "wandb", "lerobot==0.3.3",
  "augmax", "einops", "jaxtyping==0.2.36", "beartype==0.19.0", "etils[epath]",
  "pillow", "sentencepiece", "ml-collections", "numpydantic", "dm-tree", "tqdm-loggable", "fsspec[gcs]"
]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["facet0*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
